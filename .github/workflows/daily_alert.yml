name: Daily USD Red News Alert

on:
  workflow_dispatch: # Nhận lệnh kích hoạt tức thì từ cron-job.org hoặc nút bấm tay

jobs:
  send-telegram-alert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Python Script
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python3 usd_red_alert.py
