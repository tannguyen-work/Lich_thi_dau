name: Daily USD Red News Alert

on:
  schedule:
    # 00:30 UTC tương ứng 07:30 sáng giờ Việt Nam (Chạy từ Thứ 2 đến Thứ 6)
    - cron: '30 0 * * 1-5'
  workflow_dispatch: # Cho phép bấm chạy thử thủ công bất cứ lúc nào

jobs:
  send-telegram-alert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Python Script
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python3 usd_red_alert.py
